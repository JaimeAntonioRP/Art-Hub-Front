# Nginx · sitio público de ArtHub (Next.js) en TU_DOMINIO
#
# Copiar a /etc/nginx/sites-available/arthub-front, reemplazar TU_DOMINIO, enlazar en
# sites-enabled y recargar. El https lo agrega certbot (ver DESPLIEGUE.md, paso 8).

# www → dominio sin www: un solo origen (también para el CORS del backend).
server {
    listen 80;
    listen [::]:80;
    server_name www.TU_DOMINIO;
    return 301 $scheme://TU_DOMINIO$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Archivos del build de Next: tienen hash en el nombre, se guardan un año.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
